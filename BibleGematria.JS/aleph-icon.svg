<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Aleph">
  <defs>
    <!-- deep navy body, matching the app background -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18233f"/>
      <stop offset="1" stop-color="#090d18"/>
    </linearGradient>
    <!-- gold light spilling from the top, like the screen glow -->
    <radialGradient id="topGlow" cx="0.5" cy="0.16" r="0.72">
      <stop offset="0" stop-color="#d8b25e" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#d8b25e" stop-opacity="0"/>
    </radialGradient>
    <!-- soft halo behind the letter -->
    <radialGradient id="alephHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f2d488" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#f2d488" stop-opacity="0"/>
    </radialGradient>
    <!-- gold gradient for the letter itself -->
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7de97"/>
      <stop offset="0.55" stop-color="#dfbb67"/>
      <stop offset="1" stop-color="#c6963c"/>
    </linearGradient>
    <!-- gold bloom, echoing the CSS text-shadow -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="squircle">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <!-- background + glow, clipped to the rounded square -->
  <g clip-path="url(#squircle)">
    <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>
    <rect x="0" y="0" width="512" height="512" fill="url(#topGlow)"/>
  </g>

  <!-- inner gold rim, like the app window border -->
  <rect x="10" y="10" width="492" height="492" rx="104" ry="104"
        fill="none" stroke="#d8b25e" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- the drifting rings from the empty state -->
  <circle cx="256" cy="256" r="158" fill="none" stroke="#d8b25e" stroke-opacity="0.30" stroke-width="1.5"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="#d8b25e" stroke-opacity="0.12" stroke-width="1"/>

  <!-- halo + aleph -->
  <circle cx="256" cy="256" r="150" fill="url(#alephHalo)"/>
